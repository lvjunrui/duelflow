name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DuelFlow.apk && ls -lh DuelFlow.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuelFlow-apk
          path: DuelFlow.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 #${{ github.run_number }}
          files: DuelFlow.apk
          body: |
            自动构建的调试签名 APK，可直接安装。

            下载：DuelFlow.apk
