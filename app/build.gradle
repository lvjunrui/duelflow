plugins {
    id 'com.android.application'
}

def ksPath = System.getenv("KEYSTORE_FILE")
def ksPass = System.getenv("KEYSTORE_PASSWORD")
def ksAlias = System.getenv("KEY_ALIAS") ?: "duelflow"
def ksReady = ksPath != null && new File(ksPath).exists()

android {
    namespace 'com.duelflow.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.duelflow.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        release {
            if (ksReady) {
                storeFile file(ksPath)
                storeType 'PKCS12'
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
}
